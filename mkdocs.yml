    - "11 · Robotics & Embodied AI":
      - Overview: curriculum/11-robotics-embodied-ai/index.md
      - Foundation Models for Robotics: curriculum/11-robotics-embodied-ai/foundation-models-robotics.md
      - Imitation Learning: curriculum/11-robotics-embodied-ai/imitation-learning.md
      - Sim-to-Real: curriculum/11-robotics-embodied-ai/sim-to-real.md
    - "12 · Physics & Scientific AI":
      - Overview: curriculum/12-physics-scientific-ai/index.md
      - PINNs: curriculum/12-physics-scientific-ai/pinn.md
      - Fourier Neural Operators: curriculum/12-physics-scientific-ai/fno.md
      - Equivariant Networks: curriculum/12-physics-scientific-ai/equivariant-networks.md
    - "13 · Graph & Relational AI":
      - Overview: curriculum/13-graph-relational-ai/index.md
      - Message Passing: curriculum/13-graph-relational-ai/message-passing.md
      - GNN Expressivity: curriculum/13-graph-relational-ai/gnn-expressivity.md
      - Equivariant GNNs: curriculum/13-graph-relational-ai/equivariant-gnn.md
    - "14 · Biology & Life Sciences":
      - Overview: curriculum/14-biology-life-sciences/index.md
