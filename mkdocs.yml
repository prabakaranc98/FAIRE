site_name: Frontier Wiki
site_description: A wiki that nudges you toward getting things done — from ML foundations to frontier AI
site_url: https://prabakaranc98.github.io/FAIRE
repo_url: https://github.com/prabakaranc98/FAIRE
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.svg
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.path
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - def_list
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Curriculum:
    - Overview: curriculum/index.md
    - "01 · AI": curriculum/core/01-ai/index.md
    - "02 · Generative Modeling": curriculum/core/02-generative-modeling/index.md
    - "03 · Representation Learning": curriculum/core/03-representation-learning/index.md
    - "04 · Neural Networks & Deep Learning": curriculum/core/04-neural-networks-deep-learning/index.md
    - "05 · Statistical & Probabilistic ML": curriculum/core/05-statistical-probabilistic-ml/index.md
    - "06 · Reinforcement Learning": curriculum/core/06-reinforcement-learning/index.md
    - "07 · Attention, Memory, Reasoning, Continual": curriculum/core/07-attention-memory-reasoning-continual/index.md
    - "08 · Causal & Statistical Inference": curriculum/core/08-causal-statistical-inference/index.md
    - "09 · Algorithms & Systems for AI": curriculum/core/09-algorithms-systems-for-ai/index.md
    - "10 · Complexity, Cognition & Natural Intelligence": curriculum/core/10-complexity-cognition-natural-intelligence/index.md
  - References:
    - Seminal Papers: references/seminal-papers.md
    - Glossary: references/glossary.md
  - System:
    - About: about.md
    - What FAIRE is (Sense): system/sense.md
    - System Architecture: system/architecture.md
    - Structure v2 (design): system/structure-v2.md
    - Generation Status: system/status.md
    - Observer Dashboard: system/observer.md
    - Agent Changelog: system/changelog.md
    - Supervisor Report: system/supervisor.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://pracha.me
      name: pracha.me
    - icon: fontawesome/brands/github
      link: https://github.com/prabakaranc98/FAIRE
