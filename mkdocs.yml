      - Protein Language Models: curriculum/14-biology-life-sciences/protein-lm.md
      - Single-Cell AI: curriculum/14-biology-life-sciences/single-cell.md
    - "15 · ML Theory & Foundations":
      - Overview: curriculum/15-ml-theory-foundations/index.md
      - PAC Learning: curriculum/15-ml-theory-foundations/pac-learning.md
      - Double Descent: curriculum/15-ml-theory-foundations/double-descent.md
      - Neural Tangent Kernel: curriculum/15-ml-theory-foundations/ntk.md
  - Learning Arcs:
    - Overview: arcs/index.md
    - MLP to Transformer: arcs/mlp-to-transformer/index.md
    - Generative Stack: arcs/generative-stack/index.md
    - Language Models: arcs/language-models/index.md
    - Causal AI: arcs/causal-ai/index.md
    - Reinforcement Learning: arcs/reinforcement-learning/index.md
    - Systems for Scale: arcs/systems-for-scale/index.md
    - Scientific AI: arcs/scientific-ai/index.md
  - References:
    - Seminal Papers: references/seminal-papers.md
    - Glossary: references/glossary.md
  - System:
    - About: about.md
    - Generation Status: system/status.md
    - Agent Changelog: system/changelog.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://pracha.me
      name: pracha.me
    - icon: fontawesome/brands/github
      link: https://github.com/prabakaranc98/FAIRE
