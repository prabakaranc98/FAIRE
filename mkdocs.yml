site_name: Frontier Wiki
site_description: A wiki that nudges you toward getting things done — from ML foundations to frontier AI
site_url: https://prabakaranc98.github.io/FAIRE
repo_url: https://github.com/prabakaranc98/FAIRE
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Curriculum:
    - Overview: curriculum/index.md
    - "01 · AI Foundations":
      - Overview: curriculum/01-ai/index.md
      - Agent Architectures: curriculum/01-ai/agent-architectures.md
      - Classical Planning: curriculum/01-ai/classical-planning.md
      - Search Algorithms: curriculum/01-ai/search-algorithms.md
    - "02 · Generative Modeling":
      - Overview: curriculum/02-generative-modeling/index.md
      - Diffusion Models: curriculum/02-generative-modeling/diffusion-models.md
      - Flow Matching: curriculum/02-generative-modeling/flow-matching.md
      - Variational Autoencoders: curriculum/02-generative-modeling/variational-autoencoders.md
    - "03 · Representation Learning":
      - Overview: curriculum/03-representation-learning/index.md
      - Contrastive Learning: curriculum/03-representation-learning/contrastive-learning.md
      - JEPA: curriculum/03-representation-learning/jepa.md
      - Self-Supervised Learning: curriculum/03-representation-learning/self-supervised-learning.md
    - "04 · Neural Networks & Deep Learning":
      - Overview: curriculum/04-neural-networks-dl/index.md
      - Backpropagation: curriculum/04-neural-networks-dl/backpropagation.md
      - Optimization: curriculum/04-neural-networks-dl/optimization.md
      - Scaling Laws: curriculum/04-neural-networks-dl/scaling-laws.md
    - "05 · Statistical & Probabilistic ML":
      - Overview: curriculum/05-statistical-probabilistic-ml/index.md
      - Bayesian Inference: curriculum/05-statistical-probabilistic-ml/bayesian-inference.md
      - Gaussian Processes: curriculum/05-statistical-probabilistic-ml/gaussian-processes.md
      - Variational Inference: curriculum/05-statistical-probabilistic-ml/variational-inference.md
    - "06 · Reinforcement Learning":
      - Overview: curriculum/06-reinforcement-learning/index.md
      - MDPs: curriculum/06-reinforcement-learning/mdp.md
      - PPO: curriculum/06-reinforcement-learning/ppo.md
      - RLHF: curriculum/06-reinforcement-learning/rlhf.md
    - "07 · Transformers & Language Models":
      - Overview: curriculum/07-attention-memory-reasoning/index.md
      - Transformer: curriculum/07-attention-memory-reasoning/transformer.md
      - State Space Models: curriculum/07-attention-memory-reasoning/state-space-models.md
      - Vision-Language Models: curriculum/07-attention-memory-reasoning/vision-language-models.md
    - "08 · Causal & Statistical Inference":
      - Overview: curriculum/08-causal-statistical-inference/index.md
      - Structural Causal Models: curriculum/08-causal-statistical-inference/scm.md
      - Do-Calculus: curriculum/08-causal-statistical-inference/do-calculus.md
      - Counterfactuals: curriculum/08-causal-statistical-inference/counterfactuals.md
    - "09 · Algorithms & Systems for AI":
      - Overview: curriculum/09-algorithms-systems-ai/index.md
      - Data Parallelism: curriculum/09-algorithms-systems-ai/data-parallelism.md
      - KV Cache: curriculum/09-algorithms-systems-ai/kv-cache.md
      - Quantization: curriculum/09-algorithms-systems-ai/quantization.md
    - "10 · Complexity & Cognition":
      - Overview: curriculum/10-complexity-cognition/index.md
      - Complexity Classes: curriculum/10-complexity-cognition/complexity-classes.md
