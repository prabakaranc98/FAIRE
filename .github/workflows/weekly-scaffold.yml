name: Weekly Log Scaffold

# Runs every Sunday at 19:00 UTC — creates next week's log file + updates weeks.json manifest
# so the dashboard is ready for Monday tracking.

on:
  schedule:
    - cron: '0 19 * * 0'   # Sunday 19:00 UTC (1 hour before redeploy)
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create next week's log file
        run: |
          set -e

          # Compute ISO week number for NEXT week
          NEXT_WEEK=$(date -d 'next monday' '+%Y-W%V')
          WEEK_FILE="weekly/${NEXT_WEEK}.json"

          # Compute date range string  (Mon – Sun of that week)
          MON=$(date -d 'next monday' '+%b %-d')
          SUN=$(date -d 'next monday + 6 days' '+%b %-d, %Y')
          DATE_RANGE="${MON}–${SUN}"

          # Determine phase
          MONTH=$(date -d 'next monday' '+%-m')
          if   [ "$MONTH" -le 6 ]; then PHASE="Q2 — Foundation Sprint"
          elif [ "$MONTH" -le 9 ]; then PHASE="Q3 — Ship & Scale"
          else                          PHASE="Q4 — Application Blitz"
          fi

          if [ ! -f "$WEEK_FILE" ]; then
            echo "Creating ${WEEK_FILE}"
            cat > "$WEEK_FILE" <<JSON
          {
            "week": "${NEXT_WEEK}",
            "dates": "${DATE_RANGE}",
            "phase": "${PHASE}",
            "sprint": "TBD",
            "entries": {
              "lab": [],
              "think_tank": [],
              "startup": [],
              "institute": []
            },
            "artifacts": "—",
            "key_decisions": "—",
            "next_week": "—"
          }
          JSON
          else
            echo "${WEEK_FILE} already exists, skipping."
          fi

      - name: Update weeks.json manifest
        run: |
          set -e
          # Collect all weekly/*.json files (excluding TEMPLATE) and update manifest
          WEEKS=$(ls weekly/*.json | grep -v TEMPLATE | xargs -I{} basename {} .json | sort -r | python3 -c "
          import sys, json
          weeks = [l.strip() for l in sys.stdin]
          print(json.dumps({'weeks': weeks}, indent=2))
          ")
          echo "$WEEKS" > data/weeks.json
          cat data/weeks.json

      - name: Commit and push
        run: |
          git config user.name  "FAIRE Bot"
          git config user.email "faire-bot@pracha-labs.noreply"
          git add weekly/ data/weeks.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: scaffold weekly log for next week [skip ci]"
            git push
          fi
