[project]
name = "frontier-agents"
version = "0.1.0"
requires-python = ">=3.11"
description = "Editorial agent system for the Frontier Wiki — generates, reviews, and maintains wiki pages"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "exa-py>=1.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "rich>=13.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_agents"]

[project.scripts]
frontier-wiki = "frontier_agents.cli:cli"
