[project]
name = "frontier-agents"
version = "0.1.0"
requires-python = ">=3.11"
description = "Editorial agent system for the Frontier Wiki — generates, reviews, and maintains wiki pages"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "exa-py>=1.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "rich>=13.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_agents"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
frontier-wiki = "frontier_agents.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: requires real API keys (OPENROUTER_API_KEY, EXA_API_KEY)",
]
